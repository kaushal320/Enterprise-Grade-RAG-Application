name: Enterprise RAG CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-syntax:
    name: Code Quality & Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Syntax & Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Code Lint Check
        run: |
          ruff check app/ ui/ tests/ --ignore E501,F401,F841,BLE001,TRY201,S110

  unit-tests:
    name: Run Automated Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Production Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt
          pip install pytest

      - name: Execute PyTest Suite
        env:
          GROQ_API_KEY: "mock_groq_key"
          JINA_API_KEY: "mock_jina_key"
          QDRANT_API_KEY: "mock_qdrant_key"
          PORTKEY_API_KEY: "mock_portkey_key"
        run: |
          pytest tests/ -v

  eval-gate:
    name: Static Eval Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No pip install needed: evals/offline_gate.py is pure stdlib and hits
      # no live API / LLM. Validates evals/golden_dataset.json is well-formed
      # and coherent so live eval runs never consume a broken dataset.
      - name: Run Offline Static Eval Gate
        run: |
          python evals/offline_gate.py --golden evals/golden_dataset.json

  ragas-eval-gate:
    name: RAGAS Live Eval Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Production Dependencies + RAGAS
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt
          pip install ragas==0.4.3 langchain-google-vertexai "langchain-community<0.4.0"


      # ragas==0.4.3 imports the legacy langchain_community.chat_models.vertexai
      # path, which langchain-community removed in 0.4.0 — so pin <0.4.0 or the
      # `import ragas` at the top of ci_ragas_gate.py fails.
      # Live gate: imports the compiled LangGraph agent in-process (no HTTP),
      # runs the first 5 golden RAG samples, and scores Faithfulness +
      # AnswerRelevancy. Fails the build if either average drops below 0.6.
      - name: Run RAGAS Eval Gate
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          JUDGE_GROQ_KEY: ${{ secrets.JUDGE_GROQ_KEY }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_COLLECTION_NAME: ${{ secrets.QDRANT_COLLECTION_NAME }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          PORTKEY_API_KEY: ${{ secrets.PORTKEY_API_KEY }}
        run: |
          python evals/ci_ragas_gate.py --golden evals/golden_dataset.json

  docker-build-check:
    name: Verify Docker Container Compilation
    runs-on: ubuntu-latest
    needs: [lint-and-syntax, unit-tests, eval-gate, ragas-eval-gate]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: enterprise-rag-api:latest

      - name: Build UI Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./ui/Dockerfile
          push: false
          tags: enterprise-rag-ui:latest
