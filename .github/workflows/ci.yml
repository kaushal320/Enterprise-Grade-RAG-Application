name: Enterprise RAG CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-syntax:
    name: Code Quality & Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Syntax & Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Code Lint Check
        run: |
          ruff check app/ ui/ tests/ --ignore E501,F401,F841

  unit-tests:
    name: Run Automated Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Production Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt
          pip install pytest

      - name: Execute PyTest Suite
        env:
          GROQ_API_KEY: "mock_groq_key"
          JINA_API_KEY: "mock_jina_key"
          QDRANT_API_KEY: "mock_qdrant_key"
        run: |
          pytest tests/ -v

  docker-build-check:
    name: Verify Docker Container Compilation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: enterprise-rag-api:latest

      - name: Build UI Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./ui/Dockerfile
          push: false
          tags: enterprise-rag-ui:latest
